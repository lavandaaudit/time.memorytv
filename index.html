<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL PLANET MEMORY | IBONARIUM LAB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="starsCanvas"></canvas>
    <div class="glow-orb"></div>

    <div class="app-wrapper">
        <main class="main-terminal">
            <!-- Compact Header & Control Bar -->
            <header class="compact-header">
                <div class="brand-group">
                    <span class="logo-symbol">❖</span>
                    <div class="brand-titles">
                        <span class="project-title">IBONARIUM.TV</span>
                        <h1 class="main-title">ВІЗУАЛЬНА ПАМʼЯТЬ ПЛАНЕТИ</h1>
                    </div>
                </div>

                <div class="compact-controls">
                    <div class="select-container">
                        <select id="daySelect"></select>
                        <select id="monthSelect"></select>
                        <select id="yearSelect"></select>
                    </div>
                    <div class="button-group">
                        <button class="fetch-btn" id="exploreBtn">ЗАПУСТИТИ</button>
                        <button class="fetch-btn secondary" id="randomBtn">🎲 ВИПАДКОВИЙ</button>
                    </div>
                </div>
            </header>

            <!-- Screen / Video Player Only -->
            <section id="resultContainer" class="hidden">
                <div class="player-container-wrapper">
                    <div class="memory-block video-player-card">
                        <div class="block-header">
                            <span class="block-tag">ЕКРАН | ХРОНІКА</span>
                            <span id="displayDate" class="player-date-tag">--.--.----</span>
                            <span id="playerStatus" class="player-status-tag">АВТО-ПОТОК</span>
                        </div>
                        <div class="media-container" id="videoMedia"></div>
                        <div class="player-controls-bar">
                            <p id="videoDesc" class="media-desc"></p>
                            <button id="nextVideoBtn" class="next-btn" title="Наступне відео">⏭ НАСТУПНЕ ВІДЕО</button>
                        </div>
                    </div>
                </div>
            </section>

            <div id="loader" class="hidden loader-container">
                <div class="status-dot"></div>
                <p class="loader-text">ПОШУК ВІДЕО-ХРОНІКИ...</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
